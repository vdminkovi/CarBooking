<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - NateDawgs</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="style.css">
    <script defer src="../scripts/services.js"></script>
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <div class="logo">NateDawgs</div>
        <nav>
            <ul>
                <li><a href="../home/home.html">Home</a></li>
                <li><a href="../services/services.html">Services</a></li>
                <li><a href="booking.html" class="active">Booking</a></li>
                <li><a href="../contact/contact.html">Contact Me</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="booking-selection" id="booking-selection">
            <h1>Book an Appointment</h1>
            <form id="booking-form">
                <div class="form-control">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Please enteryour full name" required>
                    <div class="error" id="name-error"></div>
                </div>
                <div class="form-control">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit number" required>
                    <div class="error" id="phone-error"></div>
                </div>
                <div class="form-control">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Plase enter valid email" required>
                    <div class="error" id="email-error"></div>
                </div>
                <div class="form-control">
                    <label for="vehicle-make">Vehicle Make:</label>
                    <select id="vehicle-make" required>
                        <option value="">Select Make</option>
                    </select>
                </div>
                <div class="form-control">
                    <label for="vehicle-model">Vehicle Model:</label>
                    <select id="vehicle-model" required>
                        <option value="">Select Model</option>
                    </select>
                </div>
                <div class="form-control">
                    <label for="vehicle-year">Vehicle Year:</label>
                    <select id="vehicle-year" required>
                        <option value="">Select Year</option>
                    </select>
                </div>
                <div class="form-control">
                    <label for="service-select">Select Service:</label>
                    <select id="service-select" name="service-select" required>
                        <option value="" disabled selected>Select a service</option>
                    </select>
                </div>
                <div class="form-control">
                    <label for="date">Choose Date:</label>
                    <input type="date" id="date">
                </div>
                <div class="form-control">
                    <label for="time-select">Preferred Time:</label>
                    <select id="time-select" name="time-select" required>
                        <option value="" disabled selected>Select a time</option>
                        <option value="Morning">Morning</option>
                        <option value="Noon">Noon</option>
                        <option value="Evening">Evening</option>
                    </select>
                </div>


                <!-- <label for="service">Select Service:</label>
                <select id="service-select"></select> -->
                
                <button type="submit">Book Now</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 NateDawgs. All rights reserved.</p>
    </footer>
</body>
</html>
